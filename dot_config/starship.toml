"$schema" = 'https://starship.rs/config-schema.json'

format = "$username$hostname$localip$shlvl$singularity$kubernetes$nats$directory$vcsh$fossil_branch$fossil_metrics$vcs$docker_context$package$bun$c$cmake$cobol$cpp$daml$dart$deno$dotnet$elixir$elm$erlang$fennel$fortran$gleam$golang$gradle$haskell$haxe$helm$java$julia$kotlin$lua$maven$mojo$nim$nodejs$ocaml$odin$opa$perl$php$pulumi$purescript$python$quarto$raku$rlang$red$ruby$rust$scala$solidity$swift$terraform$typst$vlang$vagrant$xmake$zig$buf$guix_shell$nix_shell$conda$pixi$meson$spack$memory_usage$aws$gcloud$openstack$azure$direnv$env_var$mise$crystal$custom$sudo$cmd_duration$line_break$jobs$battery$time$status$container$netns$os$shell$character"
add_newline = false

[cmd_duration]
min_time = 1

[character]
error_symbol = "[❯](bold red)"
success_symbol = "[❯](green)"

[hostname]
format = "❮$hostname❯ "
disabled = false

[username]
style_user = "bold dimmed blue"
show_always = true

[directory]
truncation_length = 10
truncate_to_repo = false

[time]
disabled = false
time_format = "%T"

[battery]
disabled = false
#full_symbol = "🔋"
charging_symbol = "⚡️"
#discharging_symbol = "💀"

[[battery.display]]
threshold = 30
style = "bold red"

[jobs]

[memory_usage]
threshold = 80
style = "bold dimmed green"
disabled = false
format = "$symbol [${ram}( | ${swap})]($style) "

[git_branch]
style = "bold yellow"
only_attached = true
disabled = true

[git_status]
conflicted = "⚔️ "
style = "black"
ahead = "⇡${count}"
behind = "⇣${count}"
disabled = true

[git_commit]
#commit_hash_length = 7
only_detached = false
format = "[\\($hash\\)]($style) "
disabled = true

[git_state]
format = "[\\($state( $progress_current of $progress_total)\\)]($style) "
disabled = true
#cherry_pick = "[🍒 PICKING](bold red)"

[python]

[perl]
format = "[$symbol($version )]($style)"

[status]
disabled = false
format = " [$symbol$status]($style) "

[kubernetes]
disabled = false
detect_env_vars = ['K8S']
#detect_files = ['k8s'] # for some reason this needs to be 

[vcs]
order = ["jj", "git"]

[jj_metrics]
disabled = true
